<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Y.T.M. Homes & More</title>

<style>
  html, body { margin: 0; }
  body { background: var(--surface-page); }
  em { font-style: italic; }

  /* ---------- BENTO GRID ---------- */
  .bento {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-auto-rows: var(--bento-row, 200px);
    grid-auto-flow: row dense;
    gap: var(--bento-gap, 18px);
  }
  .bento-tile {
    position: relative;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border-radius: var(--tile-radius, 24px);
    transition: opacity .2s var(--ease-out);
  }
  .bento-tile > .ytm-lift,
  .bento-tile > div:not(.bento-grip) { flex: 1 1 auto; min-height: 0; }
  .bento-tile.is-dragging { opacity: .45; }
  .bento.is-dragging-board image-slot { pointer-events: none; }
  .bento.is-dragging-board .bento-tile { cursor: grabbing; }

  /* drag handle */
  .bento-grip {
    position: absolute; top: 7px; left: 50%; transform: translateX(-50%);
    z-index: 30; display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 20px; border-radius: 999px;
    background: var(--glass, rgba(255,255,255,.82)); backdrop-filter: blur(8px);
    border: 1px solid var(--border-soft); box-shadow: var(--shadow-xs);
    color: var(--text-muted); cursor: grab; opacity: 0;
    transition: opacity .18s var(--ease-out);
  }
  .bento-tile:hover .bento-grip { opacity: .92; }
  .bento-grip:active { cursor: grabbing; }
  .bento-grip i { width: 15px; height: 15px; transform: rotate(90deg); }

  /* lucide swaps <i data-lucide> for a 24px <svg class="lucide"> — keep
     icons inside their wrapper box so they sit on the text line */
  .ytm svg.lucide { max-width: 100%; max-height: 100%; flex-shrink: 0; }
  .bento-grip svg.lucide { width: 15px; height: 15px; transform: rotate(90deg); }
  .ytm-pill svg.lucide, .ytm-icon svg.lucide, .ytm-hint svg.lucide { width: 16px; height: 16px; }

  /* hover lift for interactive cards */
  .ytm-lift { will-change: transform; }
  .ytm-lift:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg) !important; }

  /* ---------- image-slot on-brand styling ---------- */
  image-slot {
    --slot-wash: var(--wash-coast);
    border-radius: inherit;
  }
  image-slot::part(frame) {
    background: var(--slot-wash);
    box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent-deep) 38%, transparent);
    border-radius: inherit;
  }
  /* dashed inset ring drawn on the frame so empty slots read as drop zones */
  image-slot::part(empty) {
    color: var(--accent-deep);
    font-family: var(--font-body);
    gap: 10px;
    opacity: .85;
  }
  image-slot::part(empty)::before {
    content: "";
    position: absolute;
    inset: 12px;
    border: 1.5px dashed color-mix(in srgb, var(--accent-deep) 45%, transparent);
    border-radius: 16px;
    pointer-events: none;
  }

  /* ---------- homepage split layout ---------- */
  .ytm-root { --card-gap: 24px; }
  .home-split {
    display: grid;
    grid-template-columns: 1.5fr 2.5fr;
    gap: var(--card-gap);
    align-items: start;
  }
  .home-left, .home-right {
    display: flex; flex-direction: column;
    gap: var(--card-gap);
    min-width: 0;
  }
  .home-brand { display: flex; min-height: 440px; }
  .home-brand > * { flex: 1; }
  .home-cards { display: grid; gap: var(--card-gap); }
  .home-cards-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .home-cards-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .home-card { display: flex; height: 340px; }
  .home-card > * { flex: 1; }

  @media (max-width: 960px) {
    .home-split { grid-template-columns: 1fr; }
    .home-brand { min-height: 380px; }
  }
  @media (max-width: 820px) {
    .home-cards-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 560px) {
    .home-cards-3, .home-cards-2 { grid-template-columns: 1fr; }
    .home-card { height: 300px; }
  }

  /* ---------- property detail split layout ---------- */
  .detail-split {
    display: grid;
    grid-template-columns: 1.5fr 2.5fr;
    gap: var(--card-gap);
    align-items: start;
  }
  .detail-left, .detail-right {
    display: flex; flex-direction: column;
    gap: var(--card-gap);
    min-width: 0;
  }
  .detail-gallery { display: flex; height: 460px; }
  .detail-gallery > * { flex: 1; }
  .detail-cards {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-auto-rows: 72px;
    gap: var(--card-gap);
  }
  .detail-cards > div > * { flex: 1 1 auto; min-width: 0; }

  @media (max-width: 960px) {
    .detail-split { grid-template-columns: 1fr; }
    .detail-gallery { height: 380px; }
  }
  @media (max-width: 560px) {
    .detail-cards { grid-template-columns: 1fr; }
    .detail-cards > div { grid-column: auto !important; }
    .detail-gallery { height: 320px; }
  }

  /* ---------- chrome ---------- */
  .ytm-bar {
    position: sticky; top: 0; z-index: 40;
    max-width: var(--content-max); margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 14px var(--footer-x, 28px) 6px;
  }
  .ytm-pill {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px;
    border-radius: 999px; background: var(--glass); backdrop-filter: blur(10px);
    border: 1px solid var(--border-soft); box-shadow: var(--shadow-sm);
    font-family: var(--font-body); font-size: var(--text-sm); font-weight: 600;
    color: var(--text-strong); cursor: pointer;
  }
  .ytm-bar-mid {
    display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 18px;
    border-radius: 999px; background: var(--glass); backdrop-filter: blur(10px);
    border: 1px solid var(--border-soft); box-shadow: var(--shadow-sm); min-width: 0;
  }
  .ytm-bar-mid > span { white-space: nowrap; }
  .ytm-icon {
    width: 40px; height: 40px; border-radius: 999px; display: inline-flex;
    align-items: center; justify-content: center; background: var(--glass);
    backdrop-filter: blur(10px); border: 1px solid var(--border-soft);
    box-shadow: var(--shadow-sm); cursor: pointer; color: var(--text-body);
  }
  .ytm-pill i, .ytm-icon i { width: 16px; height: 16px; }
  .ytm-pill:hover, .ytm-icon:hover { background: var(--surface-card); }

  /* ---------- booking modal ---------- */
  .ytm-ov {
    position: fixed; inset: 0; background: rgba(46,42,36,.5); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; z-index: 80; padding: 24px;
    animation: ytmfade .24s var(--ease-out);
  }
  .ytm-modal {
    max-width: 430px; width: 100%; text-align: center; background: var(--surface-card);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); padding: 32px;
    animation: ytmpop .28s var(--ease-out);
  }
  @keyframes ytmfade { from { opacity: 0; } }
  @keyframes ytmpop { from { opacity: 0; transform: translateY(12px) scale(.98); } }

  /* ---------- drag hint ---------- */
  .ytm-hint {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 60;
    display: inline-flex; align-items: center; gap: 9px; padding: 10px 16px;
    border-radius: 999px; background: var(--ink-900); color: var(--cream);
    font-family: var(--font-body); font-size: var(--text-sm); box-shadow: var(--shadow-lg);
    animation: ytmrise .4s var(--ease-out);
  }
  .ytm-hint i { width: 16px; height: 16px; }
  @keyframes ytmrise { from { opacity: 0; transform: translate(-50%, 12px); } }

  /* ---------- responsive ---------- */
  @media (max-width: 1080px) { .bento { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 760px)  { .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 540px) {
    .bento { grid-template-columns: 1fr; grid-auto-rows: auto; }
    .bento .bento-tile { grid-column: auto !important; grid-row: auto !important; min-height: 230px; }
    .ytm-bar-mid .nm-hide { display: none; }
  }
</style>
</head>
